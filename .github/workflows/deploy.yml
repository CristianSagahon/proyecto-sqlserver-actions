name: Deploy SQL Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar SQL Server en Docker
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA="$ACCEPT_EULA" \
            -e MSSQL_PID="$MSSQL_PID" \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 \
            -v "${{ github.workspace }}/sql:/sql:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
          # ← NUEVO: la línea -v conecta tu carpeta sql/ con /sql dentro del contenedor

      - name: Esperar a que SQL Server responda
        run: |
          for i in $(seq 1 30); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server listo en el intento $i"
              exit 0
            fi
            echo "Esperando... ($i/30)"
            sleep 5
          done
          docker logs mssql
          exit 1

      # ← NUEVO: estos dos pasos reemplazan a "Mostrar versión de SQL Server"
      - name: Crear base de datos
        run: |
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -i /sql/create_database.sql

      - name: Crear tablas
        run: |
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -i /sql/create_tables.sql
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C \
            -d EmpresaDB -Q "SELECT name FROM sys.tables"
      
      - name: Crear procedimiento almacenado
        run: |
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -i /sql/create_procedure.sql

      - name: Crear trigger
        run: |
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -i /sql/create_trigger.sql
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -d EmpresaDB \
            -Q "SELECT name, type_desc FROM sys.objects WHERE type IN ('P','TR')"
      - name: Insertar datos de prueba
        run: |
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -b \
            -i /sql/test_data.sql